spring:
  datasource:
    url: jdbc:mysql://${OLTP_DB_HOST:localhost}:${OLTP_DB_PORT:3306}/${OLTP_DB_NAME:erp_qlkho_oltp}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${OLTP_DB_USER:erp_user}
    password: ${OLTP_DB_PASSWORD:erp_password}
